name: SPR Production Hardening

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CI_RELEASE_GATE: '1'

jobs:
  hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refuse tracked environment files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env(\.|$)' | grep -vE '(^|/)\.env\.example$'; then
            echo 'ERROR: tracked environment file detected.'
            exit 1
          fi

      - name: Scan tracked source for high-risk credential patterns
        shell: bash
        run: |
          set -euo pipefail
          files=$(git ls-files '*.js' '*.jsx' '*.ts' '*.tsx' '*.json' '*.yml' '*.yaml' '*.md' '*.env*' '*.pem' '*.key' '*.crt' '*.conf' '*.txt')
          if [ -z "$files" ]; then exit 0; fi

          # Single-line credential patterns.
          if grep -nE --binary-files=without-match \
            -e 'AIza[0-9A-Za-z_-]{20,}' \
            -e 'sk_(live|test)_[0-9A-Za-z]{16,}' \
            -e 'whsec_[0-9A-Za-z]{16,}' \
            -e 'gh[pousr]_[A-Za-z0-9_]{20,}' \
            -e 'AKIA[0-9A-Z]{16}' \
            $files; then
            echo 'ERROR: possible credential material found in tracked files.'
            exit 1
          fi

          # Multi-line PEM private keys. Placeholder headers alone are not secrets,
          # but a real key must contain a substantial encoded body and matching footer.
          if grep -Pzo --binary-files=without-match \
            '-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----\s*[A-Za-z0-9+/=\r\n]{64,}-----END (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----' \
            $files >/dev/null 2>&1; then
            echo 'ERROR: possible private key material found in tracked files.'
            exit 1
          fi

          # JSON-encoded service-account private keys may contain escaped newlines.
          if grep -Pzo --binary-files=without-match \
            '"private_key"\s*:\s*"-----BEGIN [^"]*PRIVATE KEY-----[^"\r\n]{64,}-----END [^"]*PRIVATE KEY-----"' \
            $files >/dev/null 2>&1; then
            echo 'ERROR: possible JSON-encoded private key material found in tracked files.'
            exit 1
          fi

      - name: Validate migration ordering and safety
        shell: bash
        run: |
          set -euo pipefail
          versions=$(find migrations -maxdepth 1 -type f -name '[0-9][0-9][0-9][0-9]_*.sql' -printf '%f\n' | sort)
          test -n "$versions"
          expected=0
          while IFS= read -r file; do
            version=${file%%_*}
            number=$((10#$version))
            if [ "$number" -ne "$expected" ]; then
              echo "ERROR: migration sequence gap/duplicate before $file (expected $(printf '%04d' "$expected"))."
              exit 1
            fi
            expected=$((expected + 1))
          done <<< "$versions"

          # Reject destructive statements at SQL statement boundaries while ignoring
          # legacy commented-out DROP examples retained in historical migrations.
          if grep -RInE --include='*.sql' '(^|;)[[:space:]]*(DROP[[:space:]]+TABLE|TRUNCATE|DROP[[:space:]]+SCHEMA)([[:space:]]|;|$)' migrations; then
            echo 'ERROR: destructive migration statement detected.'
            exit 1
          fi
          echo "Validated $expected ordered migrations and destructive-SQL safety."

      - name: Verify lockfile integrity
        run: npm ci --ignore-scripts

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Test suite
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Verify expected production artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -d dist
          test -f dist/server.cjs
          test -f dist/worker.cjs
          test -f dist/connect-preload.cjs
          test -f dist/bootstrap-initial-owner.cjs

      - name: Verify no source maps or environment files were emitted
        shell: bash
        run: |
          set -euo pipefail
          if find dist -type f \( -name '*.env' -o -name '.env*' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'ERROR: credential/environment artifact emitted into dist.'
            exit 1
          fi

      - name: Release gate marker
        run: test "$CI_RELEASE_GATE" = '1'
