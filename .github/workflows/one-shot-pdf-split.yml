name: One-shot PDF bundle split

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  split-pdf-generator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply lazy PDF generator wrapper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ReportsView.tsx')
          s = p.read_text(encoding='utf-8')
          old = "import { generateClientCompliancePDF, generateCoBrandedTrustReport } from '../utils/pdfGenerator';"
          if old not in s:
              raise SystemExit('Static pdfGenerator import not found; refusing to make an unsafe edit.')
          s = s.replace(old, """type PdfGeneratorModule = typeof import('../utils/pdfGenerator');
          const loadPdfGenerator = () => import('../utils/pdfGenerator');

          const generateClientCompliancePDF = async (client: Client) => {
            const { generateClientCompliancePDF: generate } = await loadPdfGenerator();
            return generate(client);
          };

          const generateCoBrandedTrustReport = async (
            ...args: Parameters<PdfGeneratorModule['generateCoBrandedTrustReport']>
          ) => {
            const { generateCoBrandedTrustReport: generate } = await loadPdfGenerator();
            return generate(...args);
          };""")
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Production build
        run: npm run build

      - name: Commit validated change and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-shot-pdf-split.yml
          git add src/components/ReportsView.tsx .github/workflows/one-shot-pdf-split.yml
          git commit -m "perf: lazy-load PDF generator"
          git push origin HEAD:main
