name: SPR Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_RELEASE_GATE: "1"
  DATABASE_URL: "postgres://spr-ci:invalid@127.0.0.1:5432/spr_ci"

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify lockfile is present
        run: test -f package-lock.json

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Security tests
        run: npm test -- --run

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Production build
        run: npm run build

      - name: Verify production artifacts
        run: |
          test -d dist
          test -f dist/server.cjs
          test -f dist/worker.cjs
          test -f dist/connect-preload.cjs
          test -f dist/bootstrap-initial-owner.cjs

      - name: Release gate marker
        run: test "$CI_RELEASE_GATE" = "1"
